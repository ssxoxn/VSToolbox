name: build-vstoolbox

on:
  workflow_dispatch:
  push:
    paths:
      - "tweak/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Action chính thức của Theos — tự lo toolchain + SDK
      - name: Setup Theos
        uses: theos/theos-action@v1
        with:
          theos-sdks-sha: main   # pull SDKs mới nhất từ theos/sdks
          cache: true

      - name: Build dylib
        run: make -C tweak dylib

      - name: Kiểm tra artifact
        run: |
          set -e
          dylib=tweak/dist/VSToolbox.dylib
          ls -lh "$dylib"
          if strings "$dylib" | grep -qi 'substrate'; then
            echo "LỖI: dylib còn link substrate"; exit 1
          fi
          echo "OK: không phụ thuộc substrate"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSToolbox-dylib
          path: tweak/dist/VSToolbox.dylib
          if-no-files-found: error
