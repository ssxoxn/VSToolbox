name: build-vstoolbox

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile VSToolbox.dylib with native Xcode clang
        run: |
          mkdir -p tweak/dist
          cd tweak
          xcrun -sdk iphoneos clang++ \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -Wno-deprecated-declarations \
            -Wno-unused-function \
            -Wno-undeclared-selector \
            -Wno-nullability-completeness \
            -undefined dynamic_lookup \
            -install_name @rpath/VSToolbox.dylib \
            -o dist/VSToolbox.dylib \
            VSCore.mm VSUI.mm Tweak.mm

          ls -lh dist/VSToolbox.dylib
          file dist/VSToolbox.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSToolbox-dylib
          path: tweak/dist/VSToolbox.dylib
          if-no-files-found: error
